<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{heading}}</title>
  </head>
  <body style="margin: 0; padding: 30px 12px; background: #F9FAFB; font-family: Arial, Helvetica, sans-serif; color: #1E293B;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%"
      style="max-width: 600px; margin: 0 auto; background: #fff; border: 1px solid #e4e9ef; border-radius: 18px;">
      <tr>
        <td style="padding: 30px 36px 15px;">
          <img src="cid:vila-logo" width="54" height="54" alt="VILA"
            style="display: block; object-fit: contain; border: 0;">
          <div style="font-size: 22px; font-weight: 800; color: #2D9CDB; margin-top: 10px;">
            VILA<span style="color: #F2994A;">.</span>
          </div>
        </td>
      </tr>
      <tr>
        <td style="padding: 10px 36px 5px;">
          <h1 style="font-size: 27px; line-height: 1.25; margin: 0; color: #1E293B;">{{heading}}</h1>
        </td>
      </tr>
      <tr>
        <td style="padding: 12px 36px 18px;">
          <p style="font-size: 15px; line-height: 1.75; margin: 0 0 14px;">Hi {{name}},</p>
          <p style="font-size: 15px; line-height: 1.75; margin: 0;">{{body}}</p>
        </td>
      </tr>
      <!-- BEGIN ACTION -->
      <tr>
        <td style="padding: 0 36px;">
          <table role="presentation" width="100%">
            <tbody>
              <tr>
                <td align="center" style="padding: 22px 0 12px;">
                  <a href="{{actionUrl}}"
                    style="background: #2D9CDB; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; border-radius: 10px; padding: 15px 24px; display: inline-block;">{{actionText}}</a>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
      <!-- END ACTION -->
      <tr>
        <td style="padding: 25px 36px 32px;">
          <p style="margin: 0; color: #77869a; font-size: 12px; line-height: 1.7;">
            Thanks for helping us build stronger communities.<br>
            — The VILA Team
          </p>
        </td>
      </tr>
    </table>
    <p style="text-align: center; color: #8290a0; font-size: 11px; line-height: 1.7; margin: 18px auto; max-width: 600px;">
      VILA · Building connected communities, beginning with you.<br>
      This is a confirmation of an action you took on VILA.
    </p>
  </body>
</html>
